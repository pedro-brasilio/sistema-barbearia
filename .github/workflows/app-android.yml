# Gera o APK do app Flutter e, na branch main, publica em GitHub Releases.
# O botão "BAIXAR APP" do site aponta para o APK da release mais recente:
# https://github.com/pedro-brasilio/sistema-barbearia/releases/latest/download/barbershop.apk
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   - keystore PKCS12 (.p12) em base64
#   ANDROID_KEYSTORE_PASSWORD - senha da keystore (a mesma da chave)
#
# Variáveis para as notificações push (Settings > Secrets and variables > Actions > Variables),
# copiadas do projeto Firebase. Sem elas o APK funciona, só não recebe notificações:
#   FIREBASE_API_KEY, FIREBASE_APP_ID, FIREBASE_SENDER_ID, FIREBASE_PROJECT_ID

name: App Android

on:
  push:
    paths:
      - mobile/**
      - .github/workflows/app-android.yml
  workflow_dispatch:

env:
  API_URL: https://barbearia-pim-api.onrender.com/api
  FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
  FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # para criar a release
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Configura a assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/barbershop.p12
          cat > android/key.properties <<EOF
          storeFile=barbershop.p12
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=barbershop
          EOF

      - run: flutter pub get

      # build-number = número da execução, para cada APK novo instalar por cima do anterior
      - name: Gera o APK
        run: |
          flutter build apk --release \
            --dart-define=API_URL=$API_URL \
            --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY \
            --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID \
            --dart-define=FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID \
            --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID \
            --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk barbershop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: barbershop-apk
          path: mobile/barbershop.apk

      - name: Publica a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-${{ github.run_number }}" barbershop.apk \
            --target "${{ github.sha }}" \
            --title "App Android #${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}. Usa a API $API_URL." \
            --latest
